# Docs Assistant behind a password: the app is only reachable through Caddy.
# Settings come from deploy/.env (see .env.example); OPENAI_API_KEY comes from your shell.
name: docs-assistant

services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      OPENAI_API_KEY:
      COMPANY_NAME: ${COMPANY_NAME:-PawPantry}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      USAGE_LOG_PATH: /app/var/usage.jsonl
      QUESTION_LOG_PATH: ${QUESTION_LOG_PATH-/app/var/questions.jsonl}
    volumes:
      - index:/app/var
      - ${DOCS_PATH:-./docs}:/app/data/docs:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-team}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?run caddy hash-password and put the result in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  index:
  caddy_data:
  caddy_config:
